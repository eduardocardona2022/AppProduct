<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Productos</title>
    <style>
        :root {
            --color-primary: #5b52e8;
            --color-primary-hover: #4941c7;
            --color-success: #087a5a;
            --color-success-hover: #065c43;
            --color-danger: #d9485f;
            --color-danger-hover: #b8324a;
            --color-whatsapp: #25d366;
            --color-whatsapp-hover: #128c7e;
            --color-secondary: #4b5563;
            --color-secondary-hover: #374151;
            --color-text: #172033;
            --color-text-secondary: #667085;
            --color-bg: #f4f7fb;
            --color-surface: #ffffff;
            --color-surface-raised: #ffffff;
            --color-surface-muted: #f8f9fd;
            --color-border: #e3e8f0;
            --color-border-focus: #5b52e8;
            --color-info-bg: #eef0ff;
            --color-accent: #11b7a3;
            --color-accent-soft: #e4faf6;
            --color-success-soft: #e8f8f2;
            --color-danger-soft: #fff0f2;
            --focus-ring: rgba(91,82,232,0.22);
            --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);

            --transition-fast: 150ms ease;
            --transition-normal: 250ms ease;

            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
        }

        [data-theme="dark"] {
            --color-primary: #8b83ff;
            --color-primary-hover: #aaa4ff;
            --color-success: #45d9af;
            --color-success-hover: #76ebc9;
            --color-danger: #ff7b8d;
            --color-danger-hover: #ff9dab;
            --color-secondary: #94a3b8;
            --color-secondary-hover: #c0cad9;
            --color-text: #f6f7fb;
            --color-text-secondary: #a8b2c5;
            --color-bg: #0b1020;
            --color-surface: #131a2e;
            --color-surface-raised: #19223a;
            --color-surface-muted: #10172a;
            --color-border: #293653;
            --color-border-focus: #8b83ff;
            --color-info-bg: #1b2144;
            --color-accent: #35d5c1;
            --color-accent-soft: #112f37;
            --color-success-soft: #123b38;
            --color-danger-soft: #3b202e;
            --focus-ring: rgba(139,131,255,0.35);

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -4px rgba(0,0,0,0.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        .container { max-width: 720px; margin: 0 auto; padding: var(--spacing-lg); }
        h1 { text-align: center; color: var(--color-text); margin-bottom: var(--spacing-lg); font-size: var(--font-size-2xl); font-weight: 700; letter-spacing: -0.025em; }
        h2 { text-align: center; color: var(--color-text); margin-bottom: var(--spacing-lg); font-size: var(--font-size-xl); font-weight: 600; }

        .form-group { margin-bottom: var(--spacing-md); }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--color-text); font-size: var(--font-size-sm); }
        .form-group input { width: 100%; padding: 12px 14px; border: 2px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--font-size-base); transition: border-color var(--transition-fast), box-shadow var(--transition-fast); background: var(--color-surface); color: var(--color-text); min-height: 44px; }
        .form-group input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .form-group input[readonly] { background: var(--color-bg); cursor: default; color: var(--color-text-secondary); }
        .form-group input::placeholder { color: var(--color-text-secondary); opacity: 0.7; }
        .checkbox-group { display: flex; align-items: center; gap: var(--spacing-sm); }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; min-height: 20px; accent-color: var(--color-primary); cursor: pointer; }

        .total-display { font-size: var(--font-size-xl); font-weight: 700; color: var(--color-primary); padding: 12px 14px; background: var(--color-info-bg); border-radius: var(--radius-md); text-align: center; margin-top: var(--spacing-sm); border: 2px solid transparent; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: var(--spacing-lg); align-items: center; }
        .btn { padding: 12px 24px; border: none; border-radius: var(--radius-md); font-size: var(--font-size-base); font-weight: 600; cursor: pointer; transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast); width: 100%; max-width: 280px; display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-sm); min-height: 44px; position: relative; }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn:active { transform: scale(0.98) translateY(0); box-shadow: var(--shadow-sm); }
        .btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .btn-primary { background: var(--color-primary); color: #fff; }
        .btn-primary:hover { background: var(--color-primary-hover); }
        .btn-secondary { background: var(--color-secondary); color: #fff; }
        .btn-secondary:hover { background: var(--color-secondary-hover); }
        .btn-accent { background: var(--color-success); color: #fff; }
        .btn-accent:hover { background: var(--color-success-hover); }
        .btn-whatsapp { background: var(--color-whatsapp); color: #fff; }
        .btn-whatsapp:hover { background: var(--color-whatsapp-hover); }
        .btn-whatsapp svg { width: 20px; height: 20px; }
        [hidden] { display: none !important; }
        .btn-danger { background: var(--color-danger); color: #fff; padding: 8px 16px; font-size: var(--font-size-sm); max-width: none; width: auto; min-height: 36px; border-radius: var(--radius-sm); }
        .btn-danger:hover { background: var(--color-danger-hover); }
        .btn-icon { width: 44px; height: 44px; min-height: 44px; max-width: none; padding: 10px; border-radius: var(--radius-sm); }
        .btn-icon-edit { background: var(--color-primary); color: #fff; }
        .btn-icon-edit:hover { background: var(--color-primary-hover); }
        .btn-icon-delete { background: var(--color-danger); color: #fff; }
        .btn-icon-delete:hover { background: var(--color-danger-hover); }
        .table-actions { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .table-actions .btn { flex: 0 0 44px; }
        .btn-cancelar-edicion { display: none; }
        .btn-cancelar-edicion.visible { display: inline-flex; }
        .btn-back { background: var(--color-secondary); color: #fff; margin-bottom: var(--spacing-md); max-width: 220px; }
        .btn-back:hover { background: var(--color-secondary-hover); }

        .filter-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: var(--spacing-md); align-items: flex-end; }
        .filter-group .form-group { flex: 1; min-width: 140px; margin-bottom: 0; }
        .filter-group select { width: 100%; padding: 12px 14px; border: 2px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--font-size-base); min-height: 44px; background: var(--color-surface); color: var(--color-text); cursor: pointer; }
        .filter-group select:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .filter-group .btn { width: auto; margin-top: 0; align-self: flex-end; }

        .table-container { overflow-x: auto; margin-top: var(--spacing-md); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
        table { width: 100%; border-collapse: collapse; background: var(--color-surface); }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--color-border); font-size: var(--font-size-sm); }
        th { background: var(--color-primary); color: #fff; font-weight: 600; white-space: nowrap; font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.05em; }
        td { color: var(--color-text); }
        tbody tr { transition: background var(--transition-fast); }
        tbody tr:hover { background: var(--color-bg); }
        tr:last-child td { border-bottom: none; }
        .col-num { text-align: right; font-variant-numeric: tabular-nums; }
        .col-actions { text-align: center; width: 110px; }

        .totals-row { background: var(--color-info-bg); font-weight: 700; }
        .totals-row td { border-top: 2px solid var(--color-primary); }

        .report-cards-container { display: none; }

        .report-card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--spacing-md); margin-bottom: var(--spacing-md); }
        .report-card-field { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
        .report-card-label { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
        .report-card-value { color: var(--color-text); font-weight: 600; font-size: var(--font-size-sm); text-align: right; }
        .report-card-actions { border-top: 1px solid var(--color-border); margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); }
        .report-card-actions .table-actions { width: 100%; justify-content: flex-end; }

        .report-card-totals { background: var(--color-info-bg); border-radius: var(--radius-md); padding: var(--spacing-md); margin-bottom: var(--spacing-md); border-top: 2px solid var(--color-primary); }
        .report-card-totals .report-card-value { font-weight: 700; }

        .no-data { text-align: center; padding: var(--spacing-xl) var(--spacing-md); color: var(--color-text-secondary); font-style: italic; }

        .mensaje { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 14px 24px; border-radius: var(--radius-lg); font-weight: 600; z-index: 1000; display: none; box-shadow: var(--shadow-lg); max-width: 90%; text-align: center; align-items: center; gap: var(--spacing-sm); font-size: var(--font-size-sm); }
        .mensaje.animar-entrada { animation: slideIn var(--transition-normal) ease forwards; }
        .mensaje.animar-salida { animation: fadeOut var(--transition-normal) ease forwards; }
        .mensaje-exito { background: var(--color-success); color: #fff; }
        .mensaje-error { background: var(--color-danger); color: #fff; }
        .mensaje svg { width: 20px; height: 20px; flex-shrink: 0; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-100%); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; opacity: 0; transition: opacity var(--transition-normal); }
        .modal-overlay.active { display: flex; }
        .modal-overlay.visible { opacity: 1; }
        .modal-box { background: var(--color-surface); padding: var(--spacing-lg); border-radius: var(--radius-lg); text-align: center; max-width: 380px; width: 90%; box-shadow: var(--shadow-lg); transform: scale(0.9); transition: transform var(--transition-normal); }
        .modal-overlay.visible .modal-box { transform: scale(1); }
        .modal-box p { margin-bottom: var(--spacing-lg); font-size: var(--font-size-base); color: var(--color-text); font-weight: 500; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .modal-buttons .btn { max-width: 140px; padding: 10px 24px; }

        .vista { display: none; }
        .vista.activa { display: block; }

        .card { background: var(--color-surface); padding: var(--spacing-lg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--spacing-lg); }
        .header h1 { margin-bottom: 0; flex: 1; text-align: center; }

        .theme-toggle { background: var(--color-surface); border: 2px solid var(--color-border); border-radius: 50%; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast); flex-shrink: 0; position: relative; overflow: hidden; }
        .theme-toggle:hover { border-color: var(--color-primary); transform: rotate(15deg); }
        .theme-toggle:active { transform: scale(0.95); }
        .theme-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        .theme-toggle svg { width: 22px; height: 22px; transition: transform var(--transition-normal), opacity var(--transition-normal); position: absolute; }
        .theme-toggle .icon-sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
        .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
        [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header { margin-bottom: var(--spacing-md); }
            .header h1 { font-size: 1.2rem; }
            h1 { font-size: 1.3rem; margin-bottom: var(--spacing-md); }
            .card { padding: var(--spacing-md); }
            .filter-group { flex-direction: column; }
            .filter-group .form-group { min-width: 100%; }
            .filter-group .btn { width: 100%; }
            th, td { padding: 8px 8px; font-size: 0.75rem; }
            .btn { max-width: 100%; min-height: 44px; }
            .btn-danger { min-height: 44px; padding: 10px 16px; }
            .modal-buttons { flex-direction: column; }
            .modal-buttons .btn { max-width: 100%; }
            .mensaje { max-width: 90%; padding: 12px 16px; }
            .table-container { display: none; }
            .report-cards-container { display: block; }
        }

        /* Aurora visual layer */
        html { background: var(--color-bg); }
        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at 8% 4%, rgba(91,82,232,0.11), transparent 28rem), radial-gradient(circle at 92% 12%, rgba(17,183,163,0.09), transparent 24rem), var(--color-bg);
            color: var(--color-text);
            letter-spacing: -0.01em;
            position: relative;
        }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 38%); z-index: -1; }
        [data-theme="dark"] body { background: radial-gradient(circle at 8% 4%, rgba(91,82,232,0.18), transparent 28rem), radial-gradient(circle at 92% 12%, rgba(53,213,193,0.08), transparent 24rem), var(--color-bg); }
        [data-theme="dark"] body::before { background: linear-gradient(135deg, rgba(255,255,255,0.025), transparent 42%); }
        .container { max-width: 960px; padding: clamp(16px, 3vw, 40px); }
        .header {
            position: relative;
            overflow: hidden;
            padding: 20px 24px;
            margin-bottom: clamp(20px, 3vw, 32px);
            border: 1px solid var(--color-border);
            border-radius: 24px;
            background: linear-gradient(135deg, var(--color-surface-raised), var(--color-surface-muted));
            box-shadow: 0 18px 45px rgba(23,32,51,0.08);
        }
        .header::after { content: ''; position: absolute; width: 180px; height: 180px; right: -70px; top: -90px; border-radius: 50%; background: var(--color-accent-soft); opacity: 0.8; pointer-events: none; }
        [data-theme="dark"] .header { box-shadow: 0 18px 45px rgba(0,0,0,0.22); }
        .header h1 { position: relative; z-index: 1; font-size: clamp(1.35rem, 2vw, 1.85rem); letter-spacing: -0.045em; }
        .theme-toggle { z-index: 2; border: 1px solid var(--color-border); background: var(--color-surface-raised); box-shadow: 0 8px 18px rgba(23,32,51,0.08); }
        .card { border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-surface-raised); box-shadow: 0 18px 45px rgba(23,32,51,0.07); padding: clamp(20px, 3vw, 32px); }
        [data-theme="dark"] .card { box-shadow: 0 18px 45px rgba(0,0,0,0.22); }
        #vista-registro .card { background: linear-gradient(145deg, var(--color-surface-raised), var(--color-surface-muted)); }
        #vista-reportes .card { background: var(--color-surface-raised); }
        .form-group { margin-bottom: 20px; }
        .form-group label { color: var(--color-text-secondary); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .form-group input, .filter-group select {
            border: 1px solid var(--color-border);
            border-radius: 13px;
            background: var(--color-surface-muted);
            box-shadow: inset 0 1px 2px rgba(23,32,51,0.025);
            min-height: 48px;
        }
        .form-group input:focus, .filter-group select:focus { border-color: var(--color-border-focus); box-shadow: 0 0 0 4px var(--focus-ring); }
        .form-group input::placeholder { color: var(--color-text-secondary); }
        .checkbox-group { padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 13px; background: var(--color-surface-muted); }
        .checkbox-group label { color: var(--color-text); font-size: 0.82rem; letter-spacing: 0; text-transform: none; }
        .total-display { margin-top: 8px; border: 1px solid rgba(91,82,232,0.2); border-radius: 14px; background: linear-gradient(135deg, var(--color-info-bg), var(--color-accent-soft)); color: var(--color-primary); font-size: clamp(1.35rem, 3vw, 1.8rem); letter-spacing: -0.04em; }
        .btn { border: 1px solid transparent; border-radius: 13px; box-shadow: 0 8px 16px rgba(23,32,51,0.08); transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease, border-color 180ms ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(23,32,51,0.13); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, var(--color-primary), #766df3); }
        .btn-primary:hover { background: linear-gradient(135deg, var(--color-primary-hover), var(--color-primary)); }
        .btn-secondary { background: var(--color-surface-muted); border-color: var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { background: var(--color-surface-raised); border-color: var(--color-primary); }
        .btn-accent { background: linear-gradient(135deg, var(--color-success), var(--color-accent)); }
        .btn-whatsapp { color: #062b18; box-shadow: 0 8px 18px rgba(37,211,102,0.2); }
        [data-theme="dark"] .btn-primary, [data-theme="dark"] .btn-accent { color: #0b1020; }
        .btn-back { background: var(--color-surface-muted); border: 1px solid var(--color-border); color: var(--color-text); }
        .btn-icon { border: 1px solid transparent; box-shadow: none; }
        .btn-icon:hover { transform: translateY(-2px); }
        .btn:focus-visible, .theme-toggle:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }
        .filter-group { padding: 14px; margin-bottom: 22px; border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-surface-muted); }
        .filter-group .form-group { margin-bottom: 0; }
        .filter-group select { background: var(--color-surface-raised); }
        .table-container { margin-top: 20px; border: 1px solid var(--color-border); border-radius: 16px; box-shadow: 0 12px 28px rgba(23,32,51,0.06); }
        table { background: var(--color-surface-raised); }
        th { background: linear-gradient(135deg, var(--color-primary), #766df3); padding-top: 14px; padding-bottom: 14px; }
        td { border-bottom-color: var(--color-border); }
        tbody tr:nth-child(even) { background: var(--color-surface-muted); }
        tbody tr:hover { background: var(--color-info-bg); }
        .estado-entregado { color: var(--color-success) !important; font-weight: 700; }
        .estado-no-entregado { color: var(--color-danger) !important; font-weight: 700; }
        .totals-row { background: linear-gradient(135deg, var(--color-info-bg), var(--color-accent-soft)); }
        .report-card { border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-surface-raised); box-shadow: 0 12px 28px rgba(23,32,51,0.07); }
        .report-card-label { color: var(--color-text-secondary); letter-spacing: 0.02em; }
        .report-card-value { color: var(--color-text); }
        .report-card:nth-child(n) .report-card-field:nth-child(5) .report-card-value { color: var(--color-primary); font-size: 1rem; }
        .report-card-totals { border: 1px solid rgba(91,82,232,0.18); background: linear-gradient(135deg, var(--color-info-bg), var(--color-accent-soft)); }
        .no-data { border: 1px dashed var(--color-border); border-radius: 14px; background: var(--color-surface-muted); }
        .mensaje { border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(14px); }
        .modal-box { border: 1px solid var(--color-border); border-radius: 18px; background: var(--color-surface-raised); }
        .vista.activa { animation: viewIn 220ms ease both; }
        @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 700px) {
            .btn-group { flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .filter-group { flex-wrap: nowrap; }
            .filter-group .btn { min-width: 132px; }
        }
        @media (min-width: 1025px) {
            .container { padding-top: 48px; }
            .header { padding: 24px 30px; }
        }
        @media (max-width: 600px) {
            .header { padding: 16px; border-radius: 18px; }
            .card { padding: 18px; border-radius: 16px; }
            .filter-group { padding: 12px; gap: 10px; }
            .btn-group { gap: 10px; }

    <script>
        // ============================================
        // SECCION: TEMA
        // ============================================

        var TEMA_STORAGE_KEY = 'theme-preference';

        function obtenerPreferenciaTema() {
            try {
                var tema = localStorage.getItem(TEMA_STORAGE_KEY);
                if (tema) return tema;
            } catch (e) {}
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function aplicarTema(tema) {
            document.documentElement.setAttribute('data-theme', tema);
            try {
                localStorage.setItem(TEMA_STORAGE_KEY, tema);
            } catch (e) {}
        }

        function toggleTema() {
            var temaActual = document.documentElement.getAttribute('data-theme');
            var nuevoTema = temaActual === 'dark' ? 'light' : 'dark';
            aplicarTema(nuevoTema);
        }

        // ============================================
        // SECCION: UTILIDADES
        // ============================================

        function formatearMoneda(valor) {
            return Number(valor).toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function formatearFecha(fechaISO) {
            var partes = fechaISO.split('T')[0].split('-');
            var yy = partes[0].slice(2);
            return partes[2] + '/' + partes[1] + '/' + yy;
        }

        function parseFecha(fechaString) {
            return new Date(fechaString);
        }

        function obtenerFechaActualLocal() {
            var ahora = new Date();
            var offset = ahora.getTimezoneOffset() * 60000;
            return new Date(ahora.getTime() - offset).toISOString().slice(0, 16);
        }

        // ============================================
        // SECCION: STORAGE
        // ============================================

        var STORAGE_KEY = 'productos';

        function obtenerRegistros() {
            try {
                var datos = localStorage.getItem(STORAGE_KEY);
                return datos ? JSON.parse(datos) : [];
            } catch (e) {
                return [];
            }
        }

        function guardarRegistro(registro) {
            try {
                var registros = obtenerRegistros();
                registros.push(registro);
                actualizarRegistros(registros);
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    mostrarMensaje('Error: Almacenamiento lleno. No se puede guardar el registro.', 'error');
                }
                return false;
            }
        }

        function eliminarRegistro(id) {
            var registros = obtenerRegistros();
            var filtrados = registros.filter(function(r) { return r.id !== id; });
            if (filtrados.length === registros.length) {
                return false;
            }
            actualizarRegistros(filtrados);
            return true;
        }

        function actualizarRegistros(arreglo) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(arreglo));
                return true;
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.code === 22) {
                    mostrarMensaje('Error: Almacenamiento lleno. No se puede guardar el registro.', 'error');
                }
                return false;
            }
        }

        function actualizarRegistro(id, cambios) {
            var registros = obtenerRegistros();
            var encontrado = false;
            var actualizados = registros.map(function(registro) {
                if (registro.id !== id) return registro;
                encontrado = true;
                return {
                    id: registro.id,
                    fechaHora: cambios.fechaHora,
                    producto: cambios.producto,
                    precio: cambios.precio,
                    cantidad: cambios.cantidad,
                    total: cambios.total,
                    entregado: cambios.entregado
                };
            });

            if (!encontrado) return false;
            return actualizarRegistros(actualizados);
        }

        function obtenerEstadoEntrega(registro) {
            return registro.entregado === true;
        }

        // ============================================
        // SECCION: MENSAJES
        // ============================================

        var mensajeTimeout = null;

        function mostrarMensaje(texto, tipo) {
            var el = document.getElementById('mensaje');
            clearTimeout(mensajeTimeout);
            el.classList.remove('animar-entrada', 'animar-salida');

            var iconSvg = '';
            if (tipo === 'error') {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
            } else {
                iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
            }

            el.innerHTML = iconSvg + '<span>' + texto + '</span>';
            el.className = 'mensaje ' + (tipo === 'error' ? 'mensaje-error' : 'mensaje-exito');
            el.style.display = 'inline-flex';

            void el.offsetWidth;
            el.classList.add('animar-entrada');

            mensajeTimeout = setTimeout(function() {
                el.classList.remove('animar-entrada');
                el.classList.add('animar-salida');
                setTimeout(function() {
                    el.style.display = 'none';
                    el.classList.remove('animar-salida');
                }, 250);
            }, 3000);
        }

        // ============================================
        // SECCION: FORMULARIO
        // ============================================

        var idEditando = null;

        function generarId() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                try {
                    return crypto.randomUUID();
                } catch (e) {}
            }
            if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
                try {
                    var bytes = new Uint8Array(16);
                    crypto.getRandomValues(bytes);
                    bytes[6] = (bytes[6] & 0x0f) | 0x40;
                    bytes[8] = (bytes[8] & 0x3f) | 0x80;
                    var hex = '';
                    for (var i = 0; i < 16; i++) {
                        hex += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
                    }
                    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
                } catch (e) {}
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function calcularTotal() {
            var precio = parseFloat(document.getElementById('campo-precio').value) || 0;
            var cantidad = parseFloat(document.getElementById('campo-cantidad').value) || 0;
            var total = precio * cantidad;
            document.getElementById('campo-total').textContent = formatearMoneda(total);
            return total;
        }

        function validarFormulario() {
            var fecha = document.getElementById('campo-fecha').value;
            var producto = document.getElementById('campo-producto').value.trim();
            var precio = document.getElementById('campo-precio').value;
            var cantidad = document.getElementById('campo-cantidad').value;

            if (!fecha) { mostrarMensaje('La fecha y hora son obligatorias', 'error'); return false; }
            if (!producto) { mostrarMensaje('El nombre del producto es obligatorio', 'error'); return false; }
            if (precio === '' || isNaN(parseFloat(precio))) { mostrarMensaje('El precio debe ser un numero valido', 'error'); return false; }
            if (parseFloat(precio) < 0) { mostrarMensaje('El precio no puede ser negativo', 'error'); return false; }
            if (parseFloat(precio) === 0) { mostrarMensaje('El precio debe ser mayor que cero', 'error'); return false; }
            if (cantidad === '' || isNaN(parseFloat(cantidad))) { mostrarMensaje('La cantidad debe ser un numero valido', 'error'); return false; }
            if (parseFloat(cantidad) < 0) { mostrarMensaje('La cantidad no puede ser negativa', 'error'); return false; }
            if (parseFloat(cantidad) === 0) { mostrarMensaje('La cantidad debe ser mayor que cero', 'error'); return false; }

            return true;
        }

        function obtenerDatosFormulario() {
            var precio = parseFloat(document.getElementById('campo-precio').value);
            var cantidad = parseFloat(document.getElementById('campo-cantidad').value);
            return {
                fechaHora: document.getElementById('campo-fecha').value,
                producto: document.getElementById('campo-producto').value.trim(),
                precio: precio,
                cantidad: cantidad,
                total: precio * cantidad,
                entregado: document.getElementById('campo-entregado').checked
            };
        }

        function guardar() {
            if (!validarFormulario()) return;

            var datos = obtenerDatosFormulario();

            if (idEditando) {
                if (actualizarRegistro(idEditando, datos)) {
                    mostrarMensaje('Registro actualizado correctamente', 'exito');
                    limpiarFormulario();
                } else {
                    mostrarMensaje('No se encontro el registro a actualizar', 'error');
                }
                return;
            }

            var registro = {
                id: generarId(),
                fechaHora: datos.fechaHora,
                producto: datos.producto,
                precio: datos.precio,
                cantidad: datos.cantidad,
                total: datos.total,
                entregado: datos.entregado
            };

            if (guardarRegistro(registro)) {
                mostrarMensaje('Registro guardado correctamente', 'exito');
                limpiarFormulario();
            }
        }

        function limpiarFormulario() {
            idEditando = null;
            document.getElementById('campo-producto').value = '';
            document.getElementById('campo-precio').value = '';
            document.getElementById('campo-cantidad').value = '';
            document.getElementById('campo-entregado').checked = false;
            document.getElementById('campo-fecha').value = obtenerFechaActualLocal();
            document.getElementById('campo-total').textContent = '0';
            document.getElementById('btn-guardar-texto').textContent = 'Guardar';
            document.getElementById('btn-cancelar-edicion').classList.remove('visible');
            document.querySelector('.header h1').textContent = 'Registro de Productos';
        }

        function iniciarEdicion(id) {
            var registro = obtenerRegistros().find(function(r) { return r.id === id; });
            if (!registro) {
                mostrarMensaje('No se encontro el registro a editar', 'error');
                return;
            }

            idEditando = id;
            document.getElementById('campo-fecha').value = registro.fechaHora;
            document.getElementById('campo-producto').value = registro.producto;
            document.getElementById('campo-precio').value = registro.precio;
            document.getElementById('campo-cantidad').value = registro.cantidad;
            document.getElementById('campo-entregado').checked = obtenerEstadoEntrega(registro);
            calcularTotal();
            document.getElementById('btn-guardar-texto').textContent = 'Actualizar';
            document.getElementById('btn-cancelar-edicion').classList.add('visible');
            navegarA('vista-registro');
            document.querySelector('.header h1').textContent = 'Editar Producto';
        }

        function cancelarEdicion() {
            limpiarFormulario();
            mostrarMensaje('Edición cancelada', 'exito');
        }

        // ============================================
        // SECCION: REPORTE
        // ============================================

        var idEliminar = null;
        var registrosCompartirActuales = [];
        var compartirTimeout = null;
        var compartirVisibilityHandler = null;

        function cargarReporte() {
            var registros = obtenerRegistros();
            dibujarTabla(registros);
        }

        function crearAccionesReporte(id) {
            var iconoEditar = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
            var iconoEliminar = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
            return '<div class="table-actions">'
                + '<button type="button" class="btn btn-icon btn-icon-edit" aria-label="Editar registro" title="Editar registro" onclick="iniciarEdicion(\'' + id + '\')">' + iconoEditar + '</button>'
                + '<button type="button" class="btn btn-icon btn-icon-delete" aria-label="Eliminar registro" title="Eliminar registro" onclick="confirmarEliminar(\'' + id + '\')">' + iconoEliminar + '</button>'
                + '</div>';
        }

        function ordenarPorFechaDesc(registros) {
            return registros.slice().sort(function(a, b) {
                var fechaA = new Date(a.fechaHora).getTime();
                var fechaB = new Date(b.fechaHora).getTime();
                if (isNaN(fechaA)) return 1;
                if (isNaN(fechaB)) return -1;
                return fechaB - fechaA;
            });
        }

        function actualizarVisibilidadCompartir(registros) {
            registrosCompartirActuales = registros.slice();
            document.getElementById('btn-compartir-whatsapp').hidden = registros.length === 0;
        }

        function generarTextoReporte(registros) {
            var lineas = ['Reporte de Productos', ''];
            for (var i = 0; i < registros.length; i++) {
                var registro = registros[i];
                lineas.push((i + 1) + '. ' + formatearFecha(registro.fechaHora));
                lineas.push('Producto: ' + registro.producto);
                lineas.push('Precio: ' + formatearMoneda(registro.precio));
                lineas.push('Cantidad: ' + registro.cantidad);
                lineas.push('Estado: ' + (obtenerEstadoEntrega(registro) ? 'Entregado' : 'No entregado'));
                lineas.push('Total: ' + formatearMoneda(registro.total));
                lineas.push('');
            }

            var totales = calcularTotales(registros);
            lineas.push('TOTALES');
            lineas.push('Precio: ' + formatearMoneda(totales.precio));
            lineas.push('Cantidad: ' + totales.cantidad);
            lineas.push('Total: ' + formatearMoneda(totales.total));
            return lineas.join('\n');
        }

        function limpiarIntentoCompartir() {
            if (compartirVisibilityHandler) {
                document.removeEventListener('visibilitychange', compartirVisibilityHandler);
                compartirVisibilityHandler = null;
            }
            if (compartirTimeout) {
                clearTimeout(compartirTimeout);
                compartirTimeout = null;
            }
        }

        function compartirReporte() {
            if (registrosCompartirActuales.length === 0) return;

            limpiarIntentoCompartir();
            var url = 'whatsapp://send?text=' + encodeURIComponent(generarTextoReporte(registrosCompartirActuales));
            var aperturaConfirmada = false;

            function mostrarErrorCompartir() {
                if (aperturaConfirmada) return;
                limpiarIntentoCompartir();
                mostrarMensaje('no se puede compartir la información', 'error');
            }

            compartirVisibilityHandler = function() {
                if (document.visibilityState === 'hidden') {
                    aperturaConfirmada = true;
                    limpiarIntentoCompartir();
                }
            };
            document.addEventListener('visibilitychange', compartirVisibilityHandler);

            try {
                var ventana = window.open(url, '_blank');
                if (!ventana) {
                    mostrarErrorCompartir();
                    return;
                }
            } catch (e) {
                mostrarErrorCompartir();
                return;
            }

            compartirTimeout = setTimeout(mostrarErrorCompartir, 2000);
        }

        function filtrar() {
            var fechaInicial = document.getElementById('filtro-fecha-inicial').value;
            var fechaFinal = document.getElementById('filtro-fecha-final').value;
            var estadoEntrega = document.getElementById('filtro-entregado').value;
            var registros = obtenerRegistros();

            if (!fechaInicial && !fechaFinal && estadoEntrega === 'todos') {
                dibujarTabla(registros);
                return;
            }

            var filtrados = registros.filter(function(r) {
                var fechaReg = r.fechaHora;
                var coincideEstado = estadoEntrega === 'todos'
                    || (estadoEntrega === 'entregados' && obtenerEstadoEntrega(r))
                    || (estadoEntrega === 'no-entregados' && !obtenerEstadoEntrega(r));
                if (!coincideEstado) return false;
                if (!fechaInicial && !fechaFinal) return true;

                if (fechaInicial && fechaFinal) {
                    return fechaReg >= fechaInicial + 'T00:00' && fechaReg <= fechaFinal + 'T23:59';
                } else if (fechaInicial) {
                    return fechaReg >= fechaInicial + 'T00:00';
                } else {
                    return fechaReg <= fechaFinal + 'T23:59';
                }
            });

            dibujarTabla(filtrados);
        }

        function dibujarTabla(registros) {
            var contenedor = document.getElementById('contenedor-tabla');
            registros = ordenarPorFechaDesc(registros);
            actualizarVisibilidadCompartir(registros);

            if (registros.length === 0) {
                var fechaInicial = document.getElementById('filtro-fecha-inicial').value;
                var fechaFinal = document.getElementById('filtro-fecha-final').value;
                var estadoEntrega = document.getElementById('filtro-entregado').value;
                var msg = (fechaInicial || fechaFinal || estadoEntrega !== 'todos') ? 'No se encontraron registros con los filtros seleccionados' : 'No hay registros disponibles';
                contenedor.innerHTML = '<div class="no-data">' + msg + '</div>';
                dibujarCards(registros);
                return;
            }

            var html = '<table><thead><tr>';
            html += '<th>Fecha</th><th>Producto</th><th class="col-num">Precio</th><th class="col-num">Cantidad</th><th class="col-num">Total</th><th>Estado</th><th class="col-actions">Accion</th>';
            html += '</tr></thead><tbody>';

            for (var i = 0; i < registros.length; i++) {
                var r = registros[i];
                html += '<tr>';
                html += '<td>' + formatearFecha(r.fechaHora) + '</td>';
                html += '<td>' + r.producto + '</td>';
                html += '<td class="col-num">' + formatearMoneda(r.precio) + '</td>';
                html += '<td class="col-num">' + r.cantidad + '</td>';
                html += '<td class="col-num">' + formatearMoneda(r.total) + '</td>';
                html += '<td class="' + (obtenerEstadoEntrega(r) ? 'estado-entregado' : 'estado-no-entregado') + '">' + (obtenerEstadoEntrega(r) ? 'Entregado' : 'No entregado') + '</td>';
                html += '<td class="col-actions">' + crearAccionesReporte(r.id) + '</td>';
                html += '</tr>';
            }

            var totales = calcularTotales(registros);
            html += '<tr class="totals-row">';
            html += '<td colspan="2">TOTALES</td>';
            html += '<td class="col-num">' + formatearMoneda(totales.precio) + '</td>';
            html += '<td class="col-num">' + totales.cantidad + '</td>';
            html += '<td class="col-num">' + formatearMoneda(totales.total) + '</td>';
            html += '<td></td>';
            html += '<td></td>';
            html += '</tr>';

            html += '</tbody></table>';
            contenedor.innerHTML = html;

            dibujarCards(registros);
        }

        function dibujarCards(registros) {
            var contenedor = document.getElementById('contenedor-cards');
            registros = ordenarPorFechaDesc(registros);

            if (registros.length === 0) {
                var fechaInicial = document.getElementById('filtro-fecha-inicial').value;
                var fechaFinal = document.getElementById('filtro-fecha-final').value;
                var estadoEntrega = document.getElementById('filtro-entregado').value;
                var msg = (fechaInicial || fechaFinal || estadoEntrega !== 'todos') ? 'No se encontraron registros con los filtros seleccionados' : 'No hay registros disponibles';
                contenedor.innerHTML = '<div class="no-data">' + msg + '</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < registros.length; i++) {
                var r = registros[i];
                html += '<div class="report-card">';
                html += '<div class="report-card-field"><span class="report-card-label">Fecha</span><span class="report-card-value">' + formatearFecha(r.fechaHora) + '</span></div>';
                html += '<div class="report-card-field"><span class="report-card-label">Producto</span><span class="report-card-value">' + r.producto + '</span></div>';
                html += '<div class="report-card-field"><span class="report-card-label">Precio</span><span class="report-card-value">' + formatearMoneda(r.precio) + '</span></div>';
                html += '<div class="report-card-field"><span class="report-card-label">Cantidad</span><span class="report-card-value">' + r.cantidad + '</span></div>';
                html += '<div class="report-card-field"><span class="report-card-label">Total</span><span class="report-card-value">' + formatearMoneda(r.total) + '</span></div>';
                html += '<div class="report-card-field"><span class="report-card-label">Estado</span><span class="report-card-value ' + (obtenerEstadoEntrega(r) ? 'estado-entregado' : 'estado-no-entregado') + '">' + (obtenerEstadoEntrega(r) ? 'Entregado' : 'No entregado') + '</span></div>';
                html += '<div class="report-card-actions">' + crearAccionesReporte(r.id) + '</div>';
                html += '</div>';
            }

            var totales = calcularTotales(registros);
            html += '<div class="report-card-totals">';
            html += '<div class="report-card-field"><span class="report-card-label">Total Precio</span><span class="report-card-value">' + formatearMoneda(totales.precio) + '</span></div>';
            html += '<div class="report-card-field"><span class="report-card-label">Total Cantidad</span><span class="report-card-value">' + totales.cantidad + '</span></div>';
            html += '<div class="report-card-field"><span class="report-card-label">Suma Total</span><span class="report-card-value">' + formatearMoneda(totales.total) + '</span></div>';
            html += '</div>';

            contenedor.innerHTML = html;
        }

        function calcularTotales(registros) {
            var totalPrecio = 0;
            var totalCantidad = 0;
            var totalSuma = 0;
            for (var i = 0; i < registros.length; i++) {
                totalPrecio += registros[i].precio;
                totalCantidad += registros[i].cantidad;
                totalSuma += registros[i].total;
            }
            return { precio: totalPrecio, cantidad: totalCantidad, total: totalSuma };
        }

        function confirmarEliminar(id) {
            idEliminar = id;
            var modal = document.getElementById('modal-confirmacion');
            modal.classList.add('active');
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    modal.classList.add('visible');
                });
            });
        }

        function cerrarModal() {
            var modal = document.getElementById('modal-confirmacion');
            modal.classList.remove('visible');
            setTimeout(function() {
                modal.classList.remove('active');
            }, 250);
        }

        function eliminar(id) {
            if (eliminarRegistro(id)) {
                mostrarMensaje('Registro eliminado correctamente', 'exito');
                filtrar();
            } else {
                mostrarMensaje('No se encontro el registro a eliminar', 'error');
            }
            idEliminar = null;
        }

        // ============================================
        // SECCION: NAVEGACION ENTRE VISTAS
        // ============================================

        function navegarA(vista) {
            document.getElementById('vista-registro').classList.remove('activa');
            document.getElementById('vista-reportes').classList.remove('activa');
            document.getElementById(vista).classList.add('activa');

            var headerTitle = document.querySelector('.header h1');
            if (vista === 'vista-reportes') {
                headerTitle.textContent = 'Reporte de Productos';
                document.getElementById('filtro-fecha-inicial').value = '';
                document.getElementById('filtro-fecha-final').value = '';
                document.getElementById('filtro-entregado').value = 'todos';
                cargarReporte();
            } else {
                headerTitle.textContent = 'Registro de Productos';
            }
        }

        // ============================================
        // SECCION: INICIALIZACION Y EVENT LISTENERS
        // ============================================

        document.getElementById('btn-toggle-tema').addEventListener('click', toggleTema);
        document.getElementById('btn-guardar').addEventListener('click', guardar);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarFormulario);
        document.getElementById('btn-cancelar-edicion').addEventListener('click', cancelarEdicion);
        document.getElementById('btn-ir-reportes').addEventListener('click', function() { navegarA('vista-reportes'); });
        document.getElementById('btn-volver').addEventListener('click', function() { navegarA('vista-registro'); });
        document.getElementById('btn-buscar').addEventListener('click', filtrar);
        document.getElementById('btn-compartir-whatsapp').addEventListener('click', compartirReporte);

        document.getElementById('campo-precio').addEventListener('input', calcularTotal);
        document.getElementById('campo-cantidad').addEventListener('input', calcularTotal);

        document.getElementById('btn-confirmar-si').addEventListener('click', function() {
            cerrarModal();
            if (idEliminar) eliminar(idEliminar);
        });
        document.getElementById('btn-confirmar-no').addEventListener('click', function() {
            cerrarModal();
            idEliminar = null;
        });

        document.getElementById('modal-confirmacion').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
                idEliminar = null;
            }
        });

        window.addEventListener('storage', function(e) {
            if (e.key === STORAGE_KEY) {
                if (document.getElementById('vista-reportes').classList.contains('activa')) {
                    cargarReporte();
                }
            }
        });

        document.getElementById('campo-fecha').value = obtenerFechaActualLocal();
    </script>
</body>
</html>
